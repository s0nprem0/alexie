[package]
name = "alexie"
version = "0.1.0"
edition = "2024"

[lints.clippy]
all = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
zbus = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
libc = "0.2"

[profile.release]
lto = true
strip = true
opt-level = "z"
